[package]
name = "observability-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
flate2 = "=1.1.9"
observability-core = { path = "../../crates/observability-core" }
observability-sqlite = { path = "../../crates/observability-sqlite" }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "0.14"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
