openapi: 3.1.0
info:
  title: Open Observability Agent API
  version: 0.4.0
  description: Multi-tenant observability and evidence-backed agent operations API.
servers:
  - url: http://localhost:8080
security:
  - ApiKey: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: OK }
  /metrics:
    get:
      summary: Prometheus-compatible runtime and request metrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }
  /v1/traces:
    post:
      summary: Ingest an OTLP ExportTraceServiceRequest
      description: Maps valid OTLP spans to tenant observations. The response uses the request encoding and reports invalid spans through OTLP partial_success.
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, description: OTLP JSON-encoded ExportTraceServiceRequest }
      responses:
        '200':
          description: OTLP full or partial success
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, description: OTLP JSON-encoded ExportTraceServiceResponse }
        '400': { description: Invalid tenant header or request envelope }
        '413': { description: Body exceeds 4 MiB or request exceeds 1000 spans }
        '415': { description: Unsupported content type or content encoding other than identity/gzip }
        '429': { description: Ingestion concurrency slots are exhausted }
  /v1/observations:
    post:
      summary: Ingest an observation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Observation' } } }
      responses:
        '201': { description: Created }
        '202': { description: Accepted by the durable ingestion queue }
        '400': { description: Invalid observation }
    get:
      summary: Query tenant observations
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ok, error] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses: { '200': { description: Observation page } }
  /v1/diagnostics:
    post:
      summary: Generate findings from tenant observations
      responses: { '200': { description: Findings } }
  /v1/observations/batch:
    post:
      summary: Ingest a validated batch of observations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Observation' } }
      responses:
        '201': { description: Number of observations accepted }
        '202': { description: Batch atomically accepted by the durable ingestion queue }
        '400': { description: Batch rejected before append }
  /v1/agent/plan:
    post:
      summary: Plan an evidence-backed agent action
      responses: { '200': { description: Agent decision } }
  /v1/agent/execute:
    post:
      summary: Execute an allowlisted tool with approval state
      responses:
        '200': { description: Tool execution result }
        '401': { description: Missing API key }
  /v1/investigations:
    post:
      summary: Create or recover a tenant-scoped investigation run
      description: Requires SQLite storage and a tenant-scoped API key in production. Reusing the same Idempotency-Key and request returns the original run.
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvestigationRequest' }
      responses:
        '200': { description: Existing idempotent run, content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationRun' } } } }
        '201': { description: Investigation created, content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationRun' } } } }
        '400': { description: Evidence is missing or unavailable to this tenant }
        '403': { description: A tenant-scoped API key is required }
        '409': { description: SQLite is disabled or the idempotency key was reused for another request }
  /v1/investigations/{id}:
    get:
      summary: Recover a tenant-owned investigation run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Investigation run, content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationRun' } } } }
        '404': { description: Tenant-owned investigation was not found }
  /v1/investigations/{id}/execute:
    post:
      summary: Execute the server-selected read-only investigation step
      description: Completion, result Observation, and AgentRun usage are committed in one SQLite transaction. Repeating a completed run does not add usage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Completed or previously completed run, content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationRun' } } } }
        '404': { description: Tenant-owned investigation was not found }
        '409': { description: Investigation cannot be executed }
  /v1/model/complete:
    post:
      summary: Complete a model request and emit model observation plus token usage
      responses:
        '200': { description: Model response and observation }
  /v1/usage:
    post:
      summary: Record a trusted internal billable usage entry
      description: Production tenant-scoped API keys cannot call this endpoint; investigation usage is emitted by the service transaction.
      responses:
        '201': { description: Recorded }
        '403': { description: Usage events are service-managed }
    get:
      summary: Read usage for a tenant and period
      responses: { '200': { description: Usage snapshot } }
  /v1/billing/quote:
    post:
      summary: Calculate a monthly quote in integer cents
      responses:
        '200': { description: Billing quote, content: { application/json: { schema: { $ref: '#/components/schemas/BillingQuote' } } } }
  /v1/ingestion/queue:
    get:
      summary: Read durable queue counts for one tenant
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant queue counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationQueueStats' }
        '409': { description: Durable ingestion is not enabled }
  /v1/ingestion/dead-letters:
    get:
      summary: List dead letters for one tenant
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Dead letter items }
        '409': { description: Durable ingestion is not enabled }
  /v1/ingestion/dead-letters/replay:
    post:
      summary: Requeue a tenant-owned dead letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, observation_id]
              properties:
                tenant_id: { type: string, format: uuid }
                observation_id: { type: string, format: uuid }
      responses:
        '202': { description: Dead letter accepted for replay }
        '404': { description: Tenant-owned dead letter not found }
        '409': { description: Durable ingestion is not enabled }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    TenantId: { type: string, format: uuid }
    ObservationQueueStats:
      type: object
      required: [pending, processing, dead_letter]
      properties:
        pending: { type: integer, format: int64, minimum: 0 }
        processing: { type: integer, format: int64, minimum: 0 }
        dead_letter: { type: integer, format: int64, minimum: 0 }
    Observation:
      type: object
      required: [id, tenant_id, trace_id, span_id, kind, name, status, started_at_ms, duration_ms, attributes]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { $ref: '#/components/schemas/TenantId' }
        trace_id: { type: string }
        span_id: { type: string }
        kind: { type: string, enum: [Agent, Tool, Model, Workflow, Http] }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [Ok, Error] }
        started_at_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        attributes: { type: object, additionalProperties: { type: string } }
    CreateInvestigationRequest:
      type: object
      required: [objective, evidence_ids]
      properties:
        objective: { type: string, minLength: 1, maxLength: 2000 }
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    InvestigationStep:
      type: object
      required: [id, tool, approval_policy, status, input_hash]
      properties:
        id: { type: string, format: uuid }
        tool: { type: string, enum: [InspectFailureContext] }
        approval_policy: { type: string, enum: [NotRequired] }
        status: { type: string, enum: [Planned, Running, Completed, Failed] }
        input_hash: { type: string }
        output_observation_id: { type: [string, 'null'], format: uuid }
        error: { type: [string, 'null'] }
    InvestigationRun:
      type: object
      required: [id, tenant_id, objective, status, evidence_ids, steps, created_at_ms, updated_at_ms, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { $ref: '#/components/schemas/TenantId' }
        objective: { type: string }
        status: { type: string, enum: [Planned, Running, Completed, Failed] }
        evidence_ids: { type: array, items: { type: string, format: uuid } }
        steps: { type: array, items: { $ref: '#/components/schemas/InvestigationStep' } }
        result_observation_id: { type: [string, 'null'], format: uuid }
        error: { type: [string, 'null'] }
        created_at_ms: { type: integer, format: int64 }
        updated_at_ms: { type: integer, format: int64 }
        version: { type: integer, format: int64, minimum: 1 }
    BillingQuote:
      type: object
      required: [plan, period, included_observations, used_observations, included_agent_runs, used_agent_runs, base_price_cents, observation_overage_cents, agent_run_overage_cents, overage_cents, total_cents]
      properties:
        plan: { type: string, enum: [Starter, Growth, Scale] }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        included_observations: { type: integer, format: int64, minimum: 0 }
        used_observations: { type: integer, format: int64, minimum: 0 }
        included_agent_runs: { type: integer, format: int64, minimum: 0 }
        used_agent_runs: { type: integer, format: int64, minimum: 0 }
        base_price_cents: { type: integer, format: int64, minimum: 0 }
        observation_overage_cents: { type: integer, format: int64, minimum: 0 }
        agent_run_overage_cents: { type: integer, format: int64, minimum: 0 }
        overage_cents: { type: integer, format: int64, minimum: 0 }
        total_cents: { type: integer, format: int64, minimum: 0 }
